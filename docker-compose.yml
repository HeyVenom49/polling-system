services:
  postgres:
    image: postgres:17-alpine
    container_name: polling-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - polling-network

  redis:
    image: redis:8-alpine
    container_name: polling-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - polling-network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: polling-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    # App secrets/config live in apps/backend/.env (not root)
    env_file:
      - apps/backend/.env
    environment:
      # Docker network overrides — keep localhost URLs in apps/backend/.env for local bun
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - polling-network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        # Defaults match apps/frontend/.env.example (browser → host ports)
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:3000}
    container_name: polling-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    networks:
      - polling-network

volumes:
  postgres_data:

networks:
  polling-network:
